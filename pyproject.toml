[project]
name = "groundtruth"
version = "0.1.0"
description = "Image manipulation detection for insurance claims"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
groundtruth = "groundtruth.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff.lint]
# Broad excepts are intentional in the detector wrapper and in metadata parsing:
# a detector that raises must degrade to "produced no evidence", never take down
# the pipeline, and malformed EXIF in the wild is the norm rather than the exception.
ignore = ["BLE001", "S110"]
