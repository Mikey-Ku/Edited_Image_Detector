[project]
name = "groundtruth"
version = "0.1.0"
description = "Image manipulation detection for insurance claims"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "scipy>=1.12",
    # HEIC is the iPhone default since 2017, so in a claims pipeline it is the
    # common case rather than an edge case.
    "pillow-heif>=0.15",
    # SIFT keypoints for copy-move detection. Nothing else in the project needs it.
    "opencv-python-headless>=4.9",
]



[project.optional-dependencies]
# The review UI is optional -- the library and CLI need no web stack.
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
# piexif is test-only: it writes EXIF thumbnails, which is how we build a
# realistic "editor forgot to regenerate the preview" fixture.
# httpx2 backs starlette's TestClient, which is how the API is exercised in
# tests/test_api.py. Those tests skip themselves without the `ui` extra.
dev = ["pytest>=8.0", "ruff>=0.4", "piexif>=1.1", "httpx2>=0.1"]
# The two fingerprint detectors. Optional because torch is a large dependency and
# the metadata, compression, geometric and context tiers do not need it -- but
# optional is not the same as unimportant: these two are the strongest detectors in
# the set, and without them `sensor.noiseprint_structure` and
# `sensor.noiseprint_anomaly` report "not applicable" and the pipeline scores well
# below the headline AUC. Installing without this extra is a supported
# configuration; expecting the published numbers from it is not.
learned = ["torch>=2.0"]
# Reading C2PA Content Credentials. Optional because it is a compiled Rust binding
# and the pixel tiers do not need it, but it is the only thing in the project that
# can speak to a fully generated image, so a claims deployment wants it.
provenance = ["c2pa-python>=0.37"]
# docs/METHOD_STUDY.md only. scikit-learn is deliberately absent from the shipped
# library: the calibration in fusion/calibration.py is hand-implemented on numpy so
# that a deployment carries no ML runtime it does not need. The study is different.
# It has to build the alternatives fairly, and hand-rolling a gradient booster to
# lose to would be a strawman. pyarrow reads the synthbuster parquet shards.
study = ["torch>=2.0", "scikit-learn>=1.4", "pyarrow>=15.0"]

[project.scripts]
groundtruth = "groundtruth.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.hatch.build.targets.wheel.force-include]
"src/groundtruth/api/static" = "groundtruth/api/static"

[tool.ruff]
line-length = 95
target-version = "py311"
# Third-party reference source, kept verbatim so the port in
# src/groundtruth/learned/noiseprint.py can be checked against its original.
# Reformatting it would destroy exactly the property that makes it worth keeping.
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff.lint]
# Broad excepts are intentional in the detector wrapper and in metadata parsing:
# a detector that raises must degrade to "produced no evidence", never take down
# the pipeline, and malformed EXIF in the wild is the norm rather than the exception.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency system is *built* on calls in argument defaults --
# File(), Form(), Depends(). B008 is correct advice everywhere except here.
"src/groundtruth/api/server.py" = ["B008"]
